<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>이상한 나라의 근령이</title>
<style>
  /* 게임 폰트: fonts 폴더에 game.woff2 / game.ttf / game.otf 중 하나를 넣으면 자동 적용 (없으면 기본 폰트) */
  @font-face{font-family:'GameFont';src:url('fonts/game.woff2') format('woff2'),url('fonts/game.ttf') format('truetype'),url('fonts/game.otf') format('opentype');font-display:swap}
  html,body{margin:0;height:100%;background:#0d1f26;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  /* 휴대폰을 세로로 들고 있으면 가로로 돌리라고 안내 */
  #rot{display:none;position:fixed;inset:0;z-index:10;background:#0d1f26;color:#fbf8f3;align-items:center;justify-content:center;text-align:center;font:700 20px/1.6 GameFont,sans-serif;padding:24px}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="960" height="576"></canvas>
<div id="rot">휴대폰을 가로로 돌려서<br>플레이해 주세요</div>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/touch.js"></script>
<script src="js/debug.js"></script>   <!-- 개발자 모드 (설정에서 BGM 15% / 효과음 57% 후 닫기로 활성화). 완전히 막으려면 이 줄을 지우세요 -->
<script src="js/main.js"></script>
</body>
</html>
